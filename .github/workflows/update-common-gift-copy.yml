name: Restore guest invitation copy

on:
  push:
    paths:
      - ".github/workflows/update-common-gift-copy.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore guest and alias pages
        run: |
          git checkout aa0f8256a311a7c8c419848bb85582e803a88ab2 -- guests i
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore original guest invitation copy"
          git push
